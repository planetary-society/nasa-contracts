name: Daily refresh of recent contract data

on:
  # Run every day at 13:00 UTC
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

jobs:
  fetch_data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Compute fiscal years and fetch contract data
        run: |
          # Determine current calendar year and month
          CURRENT_YEAR=$(date +%Y)
          MONTH=$(date +%m)

          # Fiscal year logic:
          # If the month is October (10) or later, the fiscal year is next calendar year.
          if [ "$MONTH" -ge 10 ]; then
            FISCAL_YEAR=$((CURRENT_YEAR + 1))
          else
            FISCAL_YEAR=$CURRENT_YEAR
          fi

          echo "Current Fiscal Year: $FISCAL_YEAR"
          echo "FISCAL_YEAR=$FISCAL_YEAR" >> "$GITHUB_ENV"

          # Calculate current and past two fiscal years
          FY1=$FISCAL_YEAR
          FY2=$((FISCAL_YEAR - 1))
          FY3=$((FISCAL_YEAR - 2))
          echo "Fetching data for fiscal years: $FY1, $FY2, $FY3"

          # Run the Python script with the fiscal years and default output directory
          python fetch-contracts.py -fy $FY1 $FY2 $FY3

      - name: Export current fiscal year award statistics
        run: |
          python award_stats.py --fys "$FISCAL_YEAR" --export "data/nasa_new_award_stats_${FISCAL_YEAR}.csv"

      - name: Commit updated CSV files
        uses: EndBug/add-and-commit@a94899bca583c204427a224a7af87c02f9b325d5 # v9
        with:
          author_name: 'github-actions[bot]'
          author_email: 'github-actions[bot]@users.noreply.github.com'
          message: 'Update NASA contract CSV files'
          add: 'data/*.csv'
